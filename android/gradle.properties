# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for Jetpack Compose, Hilt, etc.).
android.useAndroidX=true

# Kotlin code style for the Android Studio formatter.
kotlin.code.style=official

# Only keep resources for the app's declared configurations in R class per module.
android.nonTransitiveRClass=true

# Run tasks in parallel where possible; cache build outputs.
org.gradle.parallel=true
org.gradle.caching=true
